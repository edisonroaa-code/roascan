name: Publish validated release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release containing the validated wheel and source archive
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the validated release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --pattern '*.tar.gz' --dir dist

      - name: Validate package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI using OpenID Connect
        uses: pypa/gh-action-pypi-publish@release/v1
